services:
  autobahn-server:
    build:
      context: ../..
      dockerfile: tools/autobahn/Dockerfile
    container_name: goose-wing-autobahn-server
    environment:
      - WING_PORT=9001
      - PYTHONUNBUFFERED=1
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s = socket.socket(); s.connect(('127.0.0.1', 9001)); s.close()\" || exit 1"]
      interval: 1s
      timeout: 2s
      retries: 10
      start_period: 1s
    restart: "no"

  autobahn-fuzzer:
    image: crossbario/autobahn-testsuite
    container_name: goose-wing-autobahn-fuzzer
    depends_on:
      autobahn-server:
        condition: service_healthy
    volumes:
      - ./fuzzingclient.json:/config/fuzzingclient.json:ro
      - ../../reports/autobahn:/reports
    command: ["wstest", "-m", "fuzzingclient", "-s", "/config/fuzzingclient.json"]
    restart: "no"
