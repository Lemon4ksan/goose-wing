services:
  grpc-server:
    build:
      context: ../..
      dockerfile: tools/grpc/Dockerfile
    container_name: goose-wing-grpc-server
    environment:
      - WING_PORT=50051
      - PYTHONUNBUFFERED=1
    ports:
      - "50051:50051"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s = socket.socket(); s.connect(('127.0.0.1', 50051)); s.close()\" || exit 1"]
      interval: 1s
      timeout: 2s
      retries: 10
      start_period: 1s
    restart: "no"

  grpc-runner:
    build:
      context: ../..
      dockerfile: tools/grpc/Dockerfile
    container_name: goose-wing-grpc-runner
    depends_on:
      grpc-server:
        condition: service_healthy
    entrypoint: ["python3", "/app/tools/grpc/runner.py", "--host", "grpc-server", "--port", "50051"]
    restart: "no"
