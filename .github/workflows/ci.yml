name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      c_shims: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.c_shims == 'true' }}
      goose: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.goose == 'true' }}
      fuzz: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.fuzz == 'true' }}
      lit: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.lit == 'true' }}
      oracles: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.oracles == 'true' }}
      protocols: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.protocols == 'true' }}
    steps:
      - name: Checkout repository
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter file paths
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            c_shims:
              - 'shim/**'
              - '.github/workflows/ci.yml'
            goose:
              - '**/*.goose'
              - 'shim/**'
              - '*.build'
              - '.github/workflows/ci.yml'
            fuzz:
              - '**/*.goose'
              - 'shim/**'
              - '*.build'
              - 'tests/fuzz/**'
              - 'scripts/sancov_runner.py'
              - '.github/workflows/ci.yml'
            lit:
              - '**/*.goose'
              - 'shim/**'
              - '*.build'
              - 'tools/test_runner.py'
              - 'scripts/verify_ct_asm.py'
              - '.lit/baseline'
              - '.github/workflows/ci.yml'
            oracles:
              - '**/*.goose'
              - 'shim/**'
              - '*.build'
              - 'tests/fuzz/**'
              - 'scripts/diff_fuzz.py'
              - 'scripts/*_differential.py'
              - '.github/workflows/ci.yml'
            protocols:
              - '**/*.goose'
              - 'shim/**'
              - '*.build'
              - 'tools/h2spec.py'
              - 'tools/h2spec/**'
              - 'tools/autobahn.py'
              - 'tools/autobahn/**'
              - 'tools/grpc.py'
              - 'tools/grpc/**'
              - 'tools/tls.py'
              - 'tools/tls/**'
              - 'tools/http3.py'
              - 'tools/http3/**'
              - 'tools/toxiproxy.py'
              - 'tools/toxiproxy/**'
              - '.github/workflows/ci.yml'

  lint-and-licensing:
    name: Lint and license check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: |
          pip install ruff

      - name: Check license headers
        run: |
          python tools/licensing.py --check

      - name: Run ruff, static invariant linter, and README signature audit
        run: |
          ruff check tools/ scripts/ .agents/
          python scripts/lint_invariants.py --strict-examples
          python scripts/verify_readme_signatures.py

      - name: Install Goose, verify formatting, and run goosemarklint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc curl ca-certificates
          curl -sSL --retry 5 --retry-delay 2 --retry-connrefused https://github.com/aardappel/goose/releases/download/v2026.4/goose-v2026.4-linux-x64.tar.gz | sudo tar -xz -C /opt
          sudo ln -sf /opt/goose-v2026.4-linux-x64/goose /usr/local/bin/goose
          goose format --check .
          mkdir -p tools/bin
          (cd tools/goosemarklint && goose build --cc gcc -O2 -o ../bin/goosemarklint src/main.goose)
          ./tools/bin/goosemarklint check .

  c-shims:
    name: Compile C shims
    needs: changes
    if: needs.changes.outputs.c_shims == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang clang-format

      - name: Verify C formatting with clang-format
        run: |
          clang-format --style=file:shim/.clang-format --dry-run --Werror shim/*.c

      - name: Compile all 13 shims with gcc
        run: |
          gcc -Wall -Wextra -Werror -c \
            shim/af_xdp.c shim/crypto_fusion.c shim/dpdk.c shim/kqueue.c \
            shim/page_mem.c shim/page_ring.c shim/rio.c \
            shim/simd.c shim/smartnic.c shim/spsc.c shim/tcp.c \
            shim/tls_backend.c shim/uring.c
          rm -f *.o

      - name: Compile all 13 shims with clang
        run: |
          clang -Wall -Wextra -Werror -c \
            shim/af_xdp.c shim/crypto_fusion.c shim/dpdk.c shim/kqueue.c \
            shim/page_mem.c shim/page_ring.c shim/rio.c \
            shim/simd.c shim/smartnic.c shim/spsc.c shim/tcp.c \
            shim/tls_backend.c shim/uring.c
          rm -f *.o

  cross-platform:
    name: Cross-platform (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.goose == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Goose toolchain (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc curl ca-certificates
          curl -sSL --retry 5 --retry-delay 2 --retry-connrefused https://github.com/aardappel/goose/releases/download/v2026.4/goose-v2026.4-linux-x64.tar.gz | sudo tar -xz -C /opt
          sudo ln -sf /opt/goose-v2026.4-linux-x64/goose /usr/local/bin/goose

      - name: Set up Goose toolchain (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ARCH="$(uname -m)"
          if [ "$ARCH" = "arm64" ]; then
            PKG="goose-v2026.4-macos-arm64"
          else
            PKG="goose-v2026.4-macos-x64"
          fi
          mkdir -p "$HOME/.local/goose"
          curl -sSL --retry 5 --retry-delay 2 --retry-connrefused "https://github.com/aardappel/goose/releases/download/v2026.4/${PKG}.tar.gz" | tar -xz -C "$HOME/.local/goose"
          GOOSE_BIN="$(find "$HOME/.local/goose" -type f -name goose | head -n 1)"
          chmod +x "$GOOSE_BIN"
          echo "$(dirname "$GOOSE_BIN")" >> "$GITHUB_PATH"

      - name: Set up Goose toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "C:\msys64\ucrt64\bin\gcc.exe") {
            Add-Content -Path $env:GITHUB_PATH -Value "C:\msys64\ucrt64\bin"
          } elseif (Test-Path "C:\msys64\mingw64\bin\gcc.exe") {
            Add-Content -Path $env:GITHUB_PATH -Value "C:\msys64\mingw64\bin"
          }
          $zip = Join-Path $env:RUNNER_TEMP "goose-v2026.4-windows-x64.zip"
          $dst = Join-Path $env:RUNNER_TEMP "goose-v2026.4"
          curl.exe -sSL --retry 5 --retry-delay 2 --retry-connrefused -o $zip https://github.com/aardappel/goose/releases/download/v2026.4/goose-v2026.4-windows-x64.zip
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          $bin = Get-ChildItem -Path $dst -Recurse -Filter "goose.exe" | Select-Object -First 1
          if (-not $bin) { throw "goose.exe not found in release archive" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin.DirectoryName
          Add-Content -Path $env:GITHUB_ENV -Value "GOOSE_CC=gcc"

      - name: Compile all 13 C shims
        shell: bash
        run: |
          CC_BIN="gcc"
          if [ "${{ runner.os }}" = "macOS" ]; then
            CC_BIN="clang"
          fi
          mkdir -p .lit/cache/shim_check
          for f in shim/*.c; do
            "$CC_BIN" -Wall -Wextra -Werror -c "$f" -o ".lit/cache/shim_check/$(basename "$f" .c).o"
          done
          rm -rf .lit/cache/shim_check

      - name: Typecheck core, wing, and wing_h1
        shell: bash
        run: |
          goose check core.goose
          goose check wing.goose
          goose check wing_h1.goose

      - name: External consumer smoke tests (core, wing_h1, wing in JIT and AOT)
        shell: bash
        run: |
          REPO_DIR="$(pwd)"
          if [ "${{ runner.os }}" = "Windows" ]; then
            REPO_DIR="$(pwd -W)"
          fi
          CC_FLAG="--cc gcc"
          EXT=""
          if [ "${{ runner.os }}" = "macOS" ]; then
            CC_FLAG="--cc clang"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            EXT=".exe"
          fi
          TMP_DIR="${RUNNER_TEMP:-/tmp}/wing_consumer_smoke"
          rm -rf "$TMP_DIR"
          mkdir -p "$TMP_DIR"

          cat > "$TMP_DIR/use_core.goose" <<EOF
          import std;
          import core from "${REPO_DIR}";
          fn main() {
              let idx = core::index_of_byte("hello-wing", '-');
              assert(idx == 5);
              print("CORE_OK");
          }
          EOF

          cat > "$TMP_DIR/use_h1.goose" <<EOF
          import std;
          import wing_h1 from "${REPO_DIR}";
          fn main() {
              var router = h1::Router { .. };
              let ok = router.add_route("GET", "/ping", 1);
              assert(ok);
              print("H1_OK");
          }
          EOF

          cat > "$TMP_DIR/use_wing.goose" <<EOF
          import std;
          import wing from "${REPO_DIR}";
          fn main() {
              var srv = server::new_http_server("127.0.0.1", 0);
              srv.add_static_get_route("/health", "text/plain", "ok", 1);
              var sess = client::new_session("https://example.com");
              sess.set_timeout_ms(5000);
              print("WING_OK");
          }
          EOF

          for name in use_core use_h1 use_wing; do
            echo "=== JIT $name ==="
            goose ${CC_FLAG} "$TMP_DIR/${name}.goose"
            echo "=== AOT $name ==="
            goose build ${CC_FLAG} -O2 -o "$TMP_DIR/${name}${EXT}" "$TMP_DIR/${name}.goose"
            "$TMP_DIR/${name}${EXT}"
          done
          rm -rf "$TMP_DIR"

      - name: Download goose-lit v0.1.0 and run cross-platform LIT suites
        shell: bash
        run: |
          LIT_DIR="${RUNNER_TEMP:-/tmp}/goose-lit-bin"
          rm -rf "$LIT_DIR"
          mkdir -p "$LIT_DIR"
          if [ "${{ runner.os }}" = "Linux" ]; then
            curl -sSL --retry 5 --retry-delay 2 --retry-connrefused https://github.com/Lemon4ksan/goose-lit/releases/download/v0.1.0/goose-lit-v0.1.0-linux-x64.tar.gz | tar -xz -C "$LIT_DIR"
            LIT_BIN="$LIT_DIR/goose-lit"
            chmod +x "$LIT_BIN"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            curl -sSL --retry 5 --retry-delay 2 --retry-connrefused https://github.com/Lemon4ksan/goose-lit/releases/download/v0.1.0/goose-lit-v0.1.0-macos-arm64.tar.gz | tar -xz -C "$LIT_DIR"
            LIT_BIN="$LIT_DIR/goose-lit"
            chmod +x "$LIT_BIN"
          else
            curl -sSL --retry 5 --retry-delay 2 --retry-connrefused -o "$LIT_DIR/lit.zip" https://github.com/Lemon4ksan/goose-lit/releases/download/v0.1.0/goose-lit-v0.1.0-windows-x64.zip
            python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$LIT_DIR/lit.zip" "$LIT_DIR"
            LIT_BIN="$LIT_DIR/goose-lit.exe"
          fi
          "$LIT_BIN" tests/lit/verify_prerelease_fixes.goose
          "$LIT_BIN" tests/lit/verify_vulkan_h1_pipeline.goose
          "$LIT_BIN" tests/lit/verify_dst_simulation.goose
          "$LIT_BIN" tests/lit/verify_checkfree_ingress_budget.goose
          "$LIT_BIN" tests/lit/verify_streaming_and_tls_backend.goose

  fuzz-ram-and-time:
    name: Fuzz constant-RAM and O(n) time budget
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up toolchain and Goose compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang gcc curl ca-certificates
          curl -sSL --retry 5 --retry-delay 2 --retry-connrefused https://github.com/aardappel/goose/releases/download/v2026.4/goose-v2026.4-linux-x64.tar.gz | sudo tar -xz -C /opt
          sudo ln -sf /opt/goose-v2026.4-linux-x64/goose /usr/local/bin/goose

      - name: Enforce constant-RAM RSS drift and O(n) complexity budgets
        run: |
          git clone --depth 1 --branch v0.1.0 https://github.com/Lemon4ksan/goose-lit.git ../goose-lit
          python scripts/sancov_runner.py --cc gcc --execs 2000 --check-complexity --max-rss-drift-kb 1024 --max-input-ms 50

      - name: Run ASan+UBSan fuzz smoke pass (-fno-sanitize-recover=all)
        run: |
          python scripts/sancov_runner.py --cc clang --asan-ubsan --execs 500 --max-rss-drift-kb 65536 --max-input-ms 200

  lit-verification:
    name: Native Goose LIT verification
    needs: changes
    if: needs.changes.outputs.lit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up toolchain and Goose compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc curl ca-certificates
          curl -sSL --retry 5 --retry-delay 2 --retry-connrefused https://github.com/aardappel/goose/releases/download/v2026.4/goose-v2026.4-linux-x64.tar.gz | sudo tar -xz -C /opt
          sudo ln -sf /opt/goose-v2026.4-linux-x64/goose /usr/local/bin/goose

      - name: Typecheck core, wing, examples, and test suites
        run: |
          python tools/test_runner.py --check-only

      - name: Build and run full test suites
        run: |
          python tools/test_runner.py -f -j 2

      - name: Install goose-lit v0.1.0
        run: |
          curl -sSL --retry 5 --retry-delay 2 --retry-connrefused https://github.com/Lemon4ksan/goose-lit/releases/download/v0.1.0/goose-lit-v0.1.0-linux-x64.tar.gz | sudo tar -xz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/goose-lit

      - name: Verify constant-time assembly and Dudect
        run: |
          python scripts/verify_ct_asm.py

      - name: Run LIT verification suites
        run: |
          goose-lit tests/lit/ -j 2

      - name: Enforce G-CRAP hardware complexity gate and ratchet
        run: |
          if command -v goose-lit >/dev/null 2>&1; then
            mkdir -p .lit/cache/cov
            goose-lit cov auth --tests tests/auth_test.goose -j 2 --lcov .lit/cache/cov/auth.info
            goose-lit cov http --tests tests/http1_test.goose --tests tests/http_cache_test.goose --tests tests/http_multipart_test.goose --tests tests/http_ohttp_test.goose -j 2 --lcov .lit/cache/cov/http.info
            cat .lit/cache/cov/auth.info .lit/cache/cov/http.info > .lit/cache/cov/merged.info
            goose-lit gate auth/pkce.goose 25 --require-cov
            goose-lit gate http/digest_fields.goose 25 --require-cov
            if [ -f ".lit/baseline" ]; then
              goose-lit crap . --baseline .lit/baseline --delta 5.0 --require-cov
            fi
          fi

  differential-oracles:
    name: Differential oracle suites
    needs: changes
    if: needs.changes.outputs.oracles == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tests/fuzz/hpackoracle/go.mod

      - name: Set up toolchain and Goose compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc curl ca-certificates
          curl -sSL --retry 5 --retry-delay 2 --retry-connrefused https://github.com/aardappel/goose/releases/download/v2026.4/goose-v2026.4-linux-x64.tar.gz | sudo tar -xz -C /opt
          sudo ln -sf /opt/goose-v2026.4-linux-x64/goose /usr/local/bin/goose

      - name: Download Go module dependencies for HPACK oracle
        run: |
          (cd tests/fuzz/hpackoracle && go mod download)

      - name: Run cryptographic and compression differential fuzzer
        run: |
          git clone --depth 1 https://github.com/C2SP/wycheproof.git ../wycheproof || true
          WP_DIR=""
          if [ -d "../wycheproof/testvectors_v1" ]; then
            WP_DIR="../wycheproof/testvectors_v1"
          elif [ -d "../wycheproof/testvectors" ]; then
            WP_DIR="../wycheproof/testvectors"
          fi
          if [ -n "$WP_DIR" ]; then
            python scripts/diff_fuzz.py --wycheproof-dir "$WP_DIR"
          else
            python scripts/diff_fuzz.py
          fi

      - name: Run HTTP/1.1 anti-smuggling differential oracle
        run: |
          python scripts/h1_differential.py --random 1000

      - name: Run URL parsing differential oracle
        run: |
          python scripts/url_differential.py --random 1000

      - name: Run HPACK differential oracle
        run: |
          python scripts/hpack_differential.py --conns 500

      - name: Run live TLS 1.3 and HTTP/2 differential oracle
        run: |
          python scripts/h2_tls_differential.py -v

  e2e-protocols:
    name: Protocol tests
    needs: changes
    if: needs.changes.outputs.protocols == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Goose compiler and h2spec
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc curl ca-certificates
          curl -sSL --retry 5 --retry-delay 2 --retry-connrefused https://github.com/aardappel/goose/releases/download/v2026.4/goose-v2026.4-linux-x64.tar.gz | sudo tar -xz -C /opt
          sudo ln -sf /opt/goose-v2026.4-linux-x64/goose /usr/local/bin/goose
          mkdir -p tools/bin
          curl -sSL --retry 5 --retry-delay 2 --retry-connrefused https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz | tar -xz -C tools/bin
          chmod +x tools/bin/h2spec

      - name: Test HTTP/2 Conformance (h2spec)
        run: |
          python tools/h2spec.py all

      - name: Test WebSocket Conformance (Autobahn)
        run: |
          python tools/autobahn.py --compose

      - name: Test gRPC
        run: |
          python tools/grpc.py --docker

      - name: Test TLS 1.3
        run: |
          python tools/tls.py --docker

      - name: Test HTTP/3
        run: |
          python tools/http3.py --docker

      - name: Test toxiproxy
        run: |
          python tools/toxiproxy.py --docker
