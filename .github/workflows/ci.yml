name: CI

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      goose: ${{ steps.filter.outputs.goose }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter file paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            goose:
              - '**/*.goose'

  lint-and-licensing:
    name: Lint and license check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: |
          pip install ruff

      - name: Check license headers
        run: |
          python tools/licensing.py --check

      - name: Run ruff and static invariant linter
        run: |
          ruff check tools/ scripts/ .agents/
          python scripts/lint_invariants.py --strict-examples

      - name: Build and run goosemarklint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc curl ca-certificates
          curl -sSL --retry 5 --retry-delay 2 --retry-connrefused https://github.com/aardappel/goose/releases/download/v2026.3/goose-v2026.3-linux-x64.tar.gz | sudo tar -xz -C /opt
          sudo ln -sf /opt/goose-v2026.3-linux-x64/goose /usr/local/bin/goose
          mkdir -p tools/bin
          (cd tools/goosemarklint && goose build --cc gcc -O2 -o ../bin/goosemarklint src/main.goose)
          ./tools/bin/goosemarklint check .

  c-shims:
    name: Compile C shims
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang

      - name: Compile with gcc
        run: |
          gcc -Wall -Wextra -Werror -c shim/simd.c shim/tcp.c shim/uring.c shim/rio.c shim/kqueue.c shim/af_xdp.c shim/smartnic.c
          rm -f *.o

      - name: Compile with clang
        run: |
          clang -Wall -Wextra -Werror -c shim/simd.c shim/tcp.c shim/uring.c shim/rio.c shim/kqueue.c shim/af_xdp.c shim/smartnic.c
          rm -f *.o

  lit-verification:
    name: Native Goose LIT verification
    needs: changes
    if: needs.changes.outputs.goose == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up toolchain and Goose compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc curl ca-certificates
          curl -sSL --retry 5 --retry-delay 2 --retry-connrefused https://github.com/aardappel/goose/releases/download/v2026.3/goose-v2026.3-linux-x64.tar.gz | sudo tar -xz -C /opt
          sudo ln -s /opt/goose-v2026.3-linux-x64/goose /usr/local/bin/goose

      - name: Typecheck core, wing, examples, and test suites
        run: |
          python tools/test_runner.py --check-only

      - name: Clone and build goose-lit
        run: |
          git clone https://github.com/Lemon4ksan/goose-lit.git ../goose-lit || true
          if [ -d "../goose-lit" ]; then
            mkdir -p ../goose-lit/bin
            goose build --cc gcc -O2 -o ../goose-lit/bin/goose-lit ../goose-lit/bin.goose
            sudo ln -s $(pwd)/../goose-lit/bin/goose-lit /usr/local/bin/goose-lit
          fi

      - name: Run LIT verification suites
        run: |
          goose-lit tests/

      - name: Enforce G-CRAP hardware complexity gate and ratchet
        run: |
          if command -v goose-lit >/dev/null 2>&1; then
            goose-lit gate auth/pkce.goose 25 --cov 0.85
            goose-lit gate http/digest_fields.goose 25 --cov 0.85
            if [ -f ".lit/baseline" ]; then
              goose-lit crap . --baseline .lit/baseline --cov 0.85 --delta 5.0
            fi
          fi

  differential-oracles:
    name: Differential oracle suites
    needs: changes
    if: needs.changes.outputs.goose == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tests/fuzz/hpackoracle/go.mod

      - name: Set up toolchain and Goose compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc curl ca-certificates
          curl -sSL --retry 5 --retry-delay 2 --retry-connrefused https://github.com/aardappel/goose/releases/download/v2026.3/goose-v2026.3-linux-x64.tar.gz | sudo tar -xz -C /opt
          sudo ln -sf /opt/goose-v2026.3-linux-x64/goose /usr/local/bin/goose

      - name: Download Go module dependencies for HPACK oracle
        run: |
          (cd tests/fuzz/hpackoracle && go mod download)

      - name: Run cryptographic and compression differential fuzzer
        run: |
          git clone --depth 1 https://github.com/C2SP/wycheproof.git ../wycheproof || true
          WP_DIR=""
          if [ -d "../wycheproof/testvectors_v1" ]; then
            WP_DIR="../wycheproof/testvectors_v1"
          elif [ -d "../wycheproof/testvectors" ]; then
            WP_DIR="../wycheproof/testvectors"
          fi
          if [ -n "$WP_DIR" ]; then
            python scripts/diff_fuzz.py --wycheproof-dir "$WP_DIR"
          else
            python scripts/diff_fuzz.py
          fi

      - name: Run HTTP/1.1 anti-smuggling differential oracle
        run: |
          python scripts/h1_differential.py --random 1000

      - name: Run URL parsing differential oracle
        run: |
          python scripts/url_differential.py --random 1000

      - name: Run HPACK differential oracle
        run: |
          python scripts/hpack_differential.py --conns 500

      - name: Run live TLS 1.3 and HTTP/2 differential oracle
        run: |
          python scripts/h2_tls_differential.py -v

  e2e-protocols:
    name: Protocol tests
    needs: changes
    if: needs.changes.outputs.goose == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install docker compose, Goose compiler, and h2spec
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc curl ca-certificates docker-compose-plugin
          curl -sSL --retry 5 --retry-delay 2 --retry-connrefused https://github.com/aardappel/goose/releases/download/v2026.3/goose-v2026.3-linux-x64.tar.gz | sudo tar -xz -C /opt
          sudo ln -sf /opt/goose-v2026.3-linux-x64/goose /usr/local/bin/goose
          mkdir -p tools/bin
          curl -sSL --retry 5 --retry-delay 2 --retry-connrefused https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz | tar -xz -C tools/bin
          chmod +x tools/bin/h2spec

      - name: Test HTTP/2 Conformance (h2spec)
        run: |
          python tools/h2spec.py all

      - name: Test WebSocket Conformance (Autobahn)
        run: |
          python tools/autobahn.py --compose

      - name: Test gRPC
        run: |
          python tools/grpc.py --docker

      - name: Test TLS 1.3
        run: |
          python tools/tls.py --docker

      - name: Test HTTP/3
        run: |
          python tools/http3.py --docker

      - name: Test toxiproxy
        run: |
          python tools/toxiproxy.py --docker
