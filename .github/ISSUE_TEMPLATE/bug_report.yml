name: "Bug Report"
description: "File a bug report, protocol discrepancy, or regression in goose-wing"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in goose-wing.
        Please provide sufficient detail for deterministic reproduction.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal Goose code, HTTP trace, or testcase that reproduces the issue.
      render: goose
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen according to protocol RFCs or documentation?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior / Logs
      description: Paste compiler errors, diagnostic output, or packet captures here.
      render: shell
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: "OS, Goose compiler version (`goose version`), network driver (epoll, io_uring, kqueue, RIO, standard sockets)."
    validations:
      required: true
